name: CI

on: [ push, pull_request ]

jobs:
  ci:
    runs-on: windows-latest
    name: CI
    steps:
      - uses: actions/checkout@v3

      - name: Check CMake version
        run: cmake --version

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Generate CMake project
        run: cmake -D CMAKE_BUILD_TYPE=Release -S. -Bbuild -G Ninja

      - name: Build 64bit release DLL
        run: cmake --build ./build --config Release --target Terminus --

      - name: Check if DLL got built
        run: if (-Not (Test-Path -path "build/Terminus.dll")) {throw 1}

      - name: Rename DLL to Terminus-dev-${{ github.sha }}.dll
        run: |
          if (Test-Path build/Terminus-dev-*.dll) { Remove-Item build/Terminus-dev-*.dll }
          Rename-Item build/Terminus.dll Terminus-dev-${{ github.sha }}.dll
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary
          path: build/Terminus-dev-*.dll
